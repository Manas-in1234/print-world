<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" fill="none">
  <defs>
    <!-- Soft Contact Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="60%" stop-color="#1F1F24"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>

    <!-- Vibrant Pink/Magenta Wave Gradient -->
    <linearGradient id="magentaWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5007D"/>
      <stop offset="100%" stop-color="#800045"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="20" width="460" height="260" rx="14" fill="url(#cardBgGrad)" stroke="#33333C" stroke-width="1.5"/>

    <!-- Diagonal Accent Waves matching reference -->
    <path d="M480 20 C420 20, 360 80, 480 140 Z" fill="url(#magentaWave)" opacity="0.9"/>
    <path d="M480 20 L380 20 C430 80, 450 140, 480 160 Z" fill="#E5007D" opacity="0.6"/>

    <!-- Subtle bottom decorative line -->
    <path d="M20 270 Q 250 250 480 270" stroke="#E5007D" stroke-width="2" opacity="0.4" fill="none"/>

    <!-- Main Name -->
    <text x="50" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#E5007D" letter-spacing="1.5">
      YOUR NAME
    </text>
    
    <!-- Designation -->
    <text x="50" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9CA3AF" letter-spacing="3">
      GRAPHIC DESIGNER
    </text>

    <!-- Thin Divider -->
    <line x1="50" y1="130" x2="260" y2="130" stroke="#374151" stroke-width="1"/>

    <!-- Contact Info Row 1: Phone -->
    <g transform="translate(50, 150)">
      <circle cx="10" cy="10" r="10" fill="#E5007D" opacity="0.2"/>
      <circle cx="10" cy="10" r="10" stroke="#E5007D" stroke-width="1.5" fill="none"/>
      <path d="M7 6 C7 6 6 8 8 10 C10 12 12 14 14 13 C15 12.5 15 11.5 14 11 L13 10 C12.5 9.5 12 10 11.5 10.5 C10.5 9.5 9.5 8.5 9 7.5 C9.5 7 10 6.5 9.5 6 L8.5 5 C8 4 7 5 7 6 Z" fill="#E5007D"/>
      <text x="30" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#D1D5DB">+91 98765 43210</text>
    </g>

    <!-- Contact Info Row 2: Email -->
    <g transform="translate(50, 185)">
      <circle cx="10" cy="10" r="10" fill="#E5007D" opacity="0.2"/>
      <circle cx="10" cy="10" r="10" stroke="#E5007D" stroke-width="1.5" fill="none"/>
      <rect x="5" y="6" width="10" height="8" rx="1.5" stroke="#E5007D" stroke-width="1.2" fill="none"/>
      <path d="M5 7 L10 10 L15 7" stroke="#E5007D" stroke-width="1.2" fill="none"/>
      <text x="30" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#D1D5DB">name@email.com</text>
    </g>

    <!-- Contact Info Row 3: Website -->
    <g transform="translate(50, 220)">
      <circle cx="10" cy="10" r="10" fill="#E5007D" opacity="0.2"/>
      <circle cx="10" cy="10" r="10" stroke="#E5007D" stroke-width="1.5" fill="none"/>
      <circle cx="10" cy="10" r="5" stroke="#E5007D" stroke-width="1.2" fill="none"/>
      <line x1="5" y1="10" x2="15" y2="10" stroke="#E5007D" stroke-width="1.2"/>
      <text x="30" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#D1D5DB">www.yourwebsite.com</text>
    </g>

    <!-- QR Code in Right Corner matching reference -->
    <g transform="translate(370, 160)">
      <rect width="70" height="70" rx="8" fill="#FFFFFF" opacity="0.08"/>
      <rect x="5" y="5" width="60" height="60" rx="6" fill="#18181B" stroke="#E5007D" stroke-width="1.5"/>
      <!-- QR Blocks -->
      <rect x="12" y="12" width="14" height="14" fill="#E5007D"/>
      <rect x="15" y="15" width="8" height="8" fill="#18181B"/>
      <rect x="44" y="12" width="14" height="14" fill="#E5007D"/>
      <rect x="47" y="15" width="8" height="8" fill="#18181B"/>
      <rect x="12" y="44" width="14" height="14" fill="#E5007D"/>
      <rect x="15" y="47" width="8" height="8" fill="#18181B"/>
      <rect x="32" y="18" width="6" height="6" fill="#FFFFFF"/>
      <rect x="32" y="32" width="10" height="10" fill="#E5007D"/>
      <rect x="46" y="36" width="6" height="6" fill="#FFFFFF"/>
      <rect x="34" y="48" width="12" height="6" fill="#E5007D"/>
    </g>
  </g>
</svg>
