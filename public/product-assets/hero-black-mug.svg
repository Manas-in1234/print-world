<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" fill="none">
  <defs>
    <!-- Soft Contact Shadow -->
    <radialGradient id="mugShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#111827" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Glossy Ceramic Black Cylinder Gradient -->
    <linearGradient id="ceramicBlack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A1E"/>
      <stop offset="15%" stop-color="#2D2D35"/>
      <stop offset="45%" stop-color="#151518"/>
      <stop offset="85%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#0F0F12"/>
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D2D35"/>
      <stop offset="40%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <!-- Mug Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A3A42"/>
      <stop offset="50%" stop-color="#555562"/>
      <stop offset="100%" stop-color="#222228"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="270" cy="480" rx="190" ry="25" fill="url(#mugShadow)" />

  <!-- Ceramic Mug Handle (Left Side matching reference) -->
  <path d="M165 170 C90 170, 70 230, 70 290 C70 360, 100 400, 165 400" 
        stroke="url(#handleGrad)" stroke-width="38" stroke-linecap="round" fill="none" />
  <path d="M165 170 C95 170, 78 230, 78 290 C78 355, 105 395, 165 395" 
        stroke="#444450" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Mug Body -->
  <rect x="150" y="110" width="240" height="340" rx="20" fill="url(#ceramicBlack)" />

  <!-- Top Rim Outer & Inner -->
  <ellipse cx="270" cy="110" rx="120" ry="20" fill="url(#rimGrad)" />
  <ellipse cx="270" cy="110" rx="108" ry="16" fill="#0A0A0C" />

  <!-- Printed Photo on Mug (Romantic couple photo with subtle curve) -->
  <g transform="translate(180, 170)">
    <rect width="180" height="220" rx="12" fill="#FFFFFF" opacity="0.08"/>
    <image href="/product-assets/acrylic-frame.jpg" x="8" y="8" width="164" height="204" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>
    <clipPath id="photoClip">
      <rect width="164" height="204" rx="8"/>
    </clipPath>
    <!-- Photo Gloss Sheen -->
    <path d="M8 8 L172 8 L8 180 Z" fill="#FFFFFF" opacity="0.15"/>
  </g>

  <!-- Vertical Gloss Highlight on Body -->
  <rect x="165" y="130" width="18" height="300" rx="9" fill="#FFFFFF" opacity="0.12" />
  <rect x="365" y="130" width="12" height="300" rx="6" fill="#FFFFFF" opacity="0.08" />

  <!-- Bottom Rim Curve -->
  <path d="M150 430 C150 460, 390 460, 390 430" fill="url(#ceramicBlack)" />
</svg>
