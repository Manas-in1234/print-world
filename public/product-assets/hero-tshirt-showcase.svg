<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" fill="none">
  <defs>
    <!-- Soft Contact Shadow -->
    <filter id="tshirtShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- White Fabric Gradient with Realistic Creasing and Folds -->
    <linearGradient id="fabricShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F9FAFB"/>
      <stop offset="70%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>

    <!-- Collar Shading -->
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#F9FAFB"/>
    </linearGradient>

    <!-- Watercolor Splatter Artwork Gradient -->
    <linearGradient id="splashCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="splashMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="splashYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <g filter="url(#tshirtShadow)">
    <!-- T-Shirt Silhouette: Collar, Sleeves, Torso with realistic natural drape -->
    <path d="M 230 40 
             C 260 65, 340 65, 370 40 
             L 480 85 
             C 520 102, 545 135, 520 195 
             L 460 170 
             L 470 560 
             C 470 575, 455 585, 435 585 
             L 165 585 
             C 145 585, 130 575, 130 560 
             L 140 170 
             L 80 195 
             C 55 135, 80 102, 120 85 
             Z" 
          fill="url(#fabricShade)" 
          stroke="#E5E7EB" 
          stroke-width="1.5"/>

    <!-- Subtle Crease Lines on Sleeves & Torso -->
    <path d="M 140 170 C 170 210, 160 300, 150 420" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round" opacity="0.4" fill="none"/>
    <path d="M 460 170 C 430 210, 440 300, 450 420" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round" opacity="0.4" fill="none"/>
    <path d="M 230 540 C 270 555, 330 555, 370 540" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round" opacity="0.3" fill="none"/>

    <!-- Ribbed Crewneck Collar -->
    <path d="M 230 40 C 260 70, 340 70, 370 40 C 350 90, 250 90, 230 40 Z" fill="url(#collarGrad)" stroke="#D1D5DB" stroke-width="2"/>
    <path d="M 270 42 C 285 58, 315 58, 330 42" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2 2" fill="none"/>

    <!-- Inside Back Neck Tag -->
    <path d="M 285 45 L 315 45 L 312 65 L 288 65 Z" fill="#E5E7EB"/>
    <text x="300" y="58" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#6B7280" text-anchor="middle">M</text>

    <!-- Vibrant Artwork on Chest: Watercolor Splashes + Sunglasses Man -->
    <g transform="translate(170, 140)">
      <!-- Watercolor Paint Splatters (Magenta, Cyan, Yellow, Purple) -->
      <path d="M 50 80 C 20 40, -10 110, 30 160 C 10 200, 70 240, 130 220 C 190 250, 240 190, 220 140 C 260 90, 210 30, 160 50 C 120 10, 70 30, 50 80 Z" 
            fill="url(#splashMagenta)" opacity="0.85"/>
      <path d="M 80 40 C 40 10, 10 70, 40 120 C 20 160, 90 200, 150 170 C 210 200, 250 140, 210 90 C 230 40, 170 10, 130 30 Z" 
            fill="url(#splashCyan)" opacity="0.8"/>
      <path d="M 120 70 C 90 30, 150 10, 180 40 C 220 30, 230 80, 200 120 C 220 160, 160 190, 120 160 C 70 180, 50 120, 80 90 Z" 
            fill="url(#splashYellow)" opacity="0.85"/>

      <!-- Splatter Drops -->
      <circle cx="15" cy="45" r="5" fill="#EC4899"/>
      <circle cx="35" cy="25" r="3.5" fill="#3B82F6"/>
      <circle cx="235" cy="55" r="6" fill="#F59E0B"/>
      <circle cx="245" cy="115" r="4" fill="#06B6D4"/>
      <circle cx="15" cy="185" r="4.5" fill="#EF4444"/>
      <circle cx="230" cy="205" r="5" fill="#8B5CF6"/>
      <circle cx="65" cy="245" r="4" fill="#10B981"/>
      <circle cx="185" cy="240" r="3.5" fill="#EC4899"/>

      <!-- Stylized Guy with Sunglasses Silhouette / Portrait inside the splash -->
      <!-- Head / Face contour -->
      <path d="M 95 110 C 95 70, 165 70, 165 110 C 165 150, 150 185, 130 185 C 110 185, 95 150, 95 110 Z" fill="#FDE68A" opacity="0.95"/>
      <!-- Stylish Hair -->
      <path d="M 90 100 C 85 60, 130 40, 160 50 C 175 55, 180 85, 165 105 C 155 75, 105 75, 90 100 Z" fill="#1F2937"/>
      <!-- Cool Sunglasses -->
      <path d="M 100 105 L 125 105 L 122 122 L 103 122 Z" fill="#111827" rx="3"/>
      <path d="M 135 105 L 160 105 L 157 122 L 138 122 Z" fill="#111827" rx="3"/>
      <line x1="125" y1="110" x2="135" y2="110" stroke="#111827" stroke-width="2.5"/>
      <line x1="104" y1="108" x2="120" y2="118" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <line x1="139" y1="108" x2="155" y2="118" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <!-- Smile & Beard / Shadow -->
      <path d="M 115 150 Q 130 162 145 150" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 110 145 C 115 170, 145 170, 150 145" stroke="#374151" stroke-width="1.5" stroke-linecap="round" opacity="0.5" fill="none"/>
      <!-- Jacket / Shirt Collar -->
      <path d="M 90 190 L 115 160 L 130 180 L 145 160 L 170 190" fill="#1F2937"/>
    </g>
  </g>
</svg>
